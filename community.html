<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapDong 커뮤니티</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:#1e3a5f;--accent:#00d4ff;--accent2:#ff3c6e;--accent3:#39ff14;--text:#e8f4fd;--text-dim:#7a9bb5;--gold:#ffd700;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;}

#comm-header{height:52px;background:var(--surface);border-bottom:2px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:100;}
.comm-logo{font-family:'Black Han Sans',sans-serif;font-size:1.2rem;color:var(--accent);letter-spacing:2px;}
.comm-logo span{color:var(--accent2);}
#btn-back-quiz{margin-left:auto;background:linear-gradient(135deg,#a29bfe,#6c5ce7);border:none;border-radius:8px;padding:6px 14px;font-size:.82rem;font-weight:700;color:#fff;cursor:pointer;transition:opacity .2s;}
#btn-back-quiz:hover{opacity:.85;}
.comm-cat-title{font-size:.9rem;color:var(--text-dim);}

#comm-body{display:flex;flex:1;min-height:0;overflow:hidden;}

#comm-left{width:200px;flex-shrink:0;background:var(--surface);border-right:2px solid var(--border);overflow-y:auto;padding:10px 0;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
#comm-left::-webkit-scrollbar{width:3px;}
#comm-left::-webkit-scrollbar-thumb{background:var(--border);}
.cl-header{padding:6px 12px;font-size:.55rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.cl-parent{padding:7px 12px;font-size:.78rem;font-weight:600;color:var(--text);cursor:pointer;transition:background .15s;user-select:none;display:flex;align-items:center;gap:6px;}
.cl-parent:hover{background:var(--surface2);}
.cl-parent .arr{margin-left:auto;font-size:.6rem;color:var(--text-dim);transition:transform .2s;}
.cl-parent.open .arr{transform:rotate(90deg);}
.cl-children{display:none;}
.cl-children.open{display:block;}
.cl-child{padding:6px 12px 6px 26px;font-size:.73rem;color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s;}
.cl-child:hover{background:var(--surface2);color:var(--text);}
.cl-child.active{color:var(--accent);background:rgba(0,212,255,.08);}

#comm-main{flex:1;overflow-y:auto;padding:20px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
#comm-main::-webkit-scrollbar{width:4px;}
#comm-main::-webkit-scrollbar-thumb{background:var(--border);}

.board-top{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.board-title{font-size:1.1rem;font-weight:700;color:var(--text);}
.board-write-btn{margin-left:auto;background:var(--accent);color:#000;border:none;border-radius:8px;padding:7px 16px;font-size:.8rem;font-weight:700;cursor:pointer;transition:opacity .2s;}
.board-write-btn:hover{opacity:.85;}

.post-row{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;cursor:pointer;transition:border-color .15s,background .15s;display:grid;grid-template-columns:1fr auto;gap:4px;margin-bottom:4px;}
.post-row:hover{border-color:var(--accent);background:rgba(0,212,255,.04);}
.post-title-row{display:flex;align-items:center;gap:8px;}
.post-title{font-size:.88rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.post-pin{color:var(--gold);font-size:.75rem;}
.post-meta{font-size:.68rem;color:var(--text-dim);grid-column:1;margin-top:3px;}
.post-stats{font-size:.65rem;color:var(--text-dim);text-align:right;align-self:center;}
.post-has-img{font-size:.65rem;color:var(--accent);margin-left:4px;}

.locked-notice{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:30px;text-align:center;}
.locked-notice .lock-icon{font-size:2.5rem;margin-bottom:12px;}
.locked-notice h3{color:var(--text);margin-bottom:8px;}
.locked-notice p{color:var(--text-dim);font-size:.85rem;line-height:1.7;}
.lock-upgrade-btn{display:inline-block;margin-top:16px;background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:.85rem;font-weight:700;cursor:pointer;}

#post-view{display:none;}
.post-view-header{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);}
.post-view-title{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:6px;}
.post-view-meta{font-size:.72rem;color:var(--text-dim);}
.post-view-content{font-size:.88rem;color:var(--text);line-height:1.9;word-break:break-word;}
.post-view-content img{max-width:100%;max-height:600px;border-radius:8px;cursor:pointer;margin:8px 0;display:block;object-fit:contain;border:1px solid var(--border);}
#btn-back-list{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:5px 12px;font-size:.78rem;cursor:pointer;margin-bottom:16px;}
#btn-back-list:hover{border-color:var(--accent);color:var(--accent);}

#post-write{display:none;}
.write-form-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:14px;}
.write-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:.85rem;outline:none;transition:border-color .15s;}
.write-input:focus{border-color:var(--accent);}

.editor-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;}
.toolbar-btn{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer;transition:all .15s;font-family:'Noto Sans KR',sans-serif;}
.toolbar-btn:hover{border-color:var(--accent);color:var(--accent);}
.img-size-info{font-size:.68rem;color:var(--text-dim);margin-left:auto;}

#write-editor{width:100%;min-height:280px;max-height:60vh;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:.88rem;line-height:1.8;outline:none;overflow-y:auto;word-break:break-word;}
#write-editor:focus{border-color:var(--accent);}
#write-editor:empty::before{content:attr(placeholder);color:var(--text-dim);pointer-events:none;}
#write-editor img{max-width:100%;max-height:500px;border-radius:8px;margin:6px 0;display:block;border:1px solid var(--border);cursor:pointer;}
#write-editor img:hover{border-color:var(--accent);}

.write-actions{display:flex;gap:10px;margin-top:12px;justify-content:flex-end;}
.btn-submit{background:var(--accent);color:#000;border:none;border-radius:8px;padding:9px 22px;font-size:.85rem;font-weight:700;cursor:pointer;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
.btn-cancel-write{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:9px 16px;font-size:.85rem;cursor:pointer;}

.post-title-only{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.85rem;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
.post-title-only .pt-title{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.pagination{display:flex;gap:6px;justify-content:center;margin-top:20px;}
.pg-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:5px 10px;font-size:.78rem;cursor:pointer;transition:all .15s;}
.pg-btn:hover,.pg-btn.active{border-color:var(--accent);color:var(--accent);}

.insurance-notice{background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);border-radius:10px;padding:10px 14px;font-size:.75rem;color:var(--gold);margin-bottom:12px;line-height:1.7;}

#img-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;align-items:center;justify-content:center;}
#img-lightbox.show{display:flex;}
#lightbox-img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:8px;}
#lightbox-close{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
#lightbox-close:hover{background:rgba(255,60,110,.6);}

@media(max-width:640px){#comm-left{width:160px;}#comm-main{padding:12px;}}
</style>
</head>
<body>

<div id="comm-header">
  <div class="comm-logo">Map<span>Dong</span></div>
  <div class="comm-cat-title" id="comm-cat-title">커뮤니티</div>
  <button id="btn-back-quiz" onclick="backToQuiz()">🗺 퀴즈로 돌아가기</button>
</div>

<div id="comm-body">
  <div id="comm-left">
    <div class="cl-header">카테고리</div>
    <div id="comm-sidebar"></div>
  </div>

  <div id="comm-main">
    <!-- 목록 -->
    <div id="post-list-view">
      <div class="board-top">
        <div class="board-title" id="board-title">게시판</div>
        <button class="board-write-btn" id="btn-write" onclick="showWriteForm()" style="display:none">✏️ 글쓰기</button>
      </div>
      <div id="insurance-notice" class="insurance-notice" style="display:none">
        🛡️ 이 게시판은 <strong>보험 자격증 보유자</strong>만 글쓰기 가능합니다. 열람은 프리미엄·맵동가족 회원 모두 가능합니다.
      </div>
      <div id="post-list"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- 상세 -->
    <div id="post-view" style="display:none;">
      <button id="btn-back-list" onclick="showListView()">← 목록으로</button>
      <div class="post-view-header">
        <div class="post-view-title" id="pv-title"></div>
        <div class="post-view-meta" id="pv-meta"></div>
      </div>
      <div class="post-view-content" id="pv-content"></div>
    </div>

    <!-- 글쓰기 -->
    <div id="post-write" style="display:none;">
      <button onclick="showListView()" style="background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:5px 12px;font-size:.78rem;cursor:pointer;margin-bottom:14px;">← 목록으로</button>
      <div class="write-form-title">✏️ 새 글쓰기</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;">
        <input id="write-title-input" class="write-input" placeholder="제목을 입력하세요" maxlength="100">
        <div class="editor-toolbar">
          <button class="toolbar-btn" onclick="triggerImgUpload()">🖼 이미지 삽입</button>
          <div style="width:1px;height:18px;background:var(--border);"></div>
          <span class="img-size-info">JPG·PNG·GIF·WEBP 최대 24MB · 자동 리사이즈 500×600</span>
        </div>
        <input type="file" id="img-file-input" accept="image/*" multiple style="display:none;" onchange="handleImgFiles(this.files)">
        <div id="write-editor" contenteditable="true"
          placeholder="내용을 입력하세요. 이미지는 '이미지 삽입' 버튼, 붙여넣기, 드래그앤드롭으로 추가 가능합니다."
          onpaste="handlePaste(event)"
          ondrop="handleDrop(event)"
          ondragover="event.preventDefault()"></div>
      </div>
      <div class="write-actions">
        <button class="btn-cancel-write" onclick="showListView()">취소</button>
        <button class="btn-submit" id="btn-submit-post" onclick="submitPost()">등록하기</button>
      </div>
    </div>
  </div>
</div>

<!-- 라이트박스 -->
<div id="img-lightbox">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="원본 이미지">
</div>

<script>
const SUPABASE_URL = 'https://emgsueepzioudqnitkyn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtZ3N1ZWVwemlvdWRxbml0a3luIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA5ODkwNzQsImV4cCI6MjA4NjU2NTA3NH0.epR1k3MVh0MfZejFh9VflCNOS8Uz8EuCZlez5OBMz3s';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser=null, userProfile=null;
let currentCatId=null, currentCatSlug=null, currentCatName='게시판';
let currentPage=1;
const PAGE_SIZE=20;
const IMG_MAX_BYTES=24*1024*1024, IMG_MAX_W=500, IMG_MAX_H=600;

const CATS=[
  {id:1,name:'보험관련문의',slug:'insurance',icon:'🛡️',insuranceOnly:true,children:[
    {id:11,name:'보험가입',slug:'insurance-join'},
    {id:12,name:'사고났어요',slug:'insurance-accident'},
    {id:13,name:'보상관련',slug:'insurance-claim'},
  ]},
  {id:2,name:'퀵서비스',slug:'quick',icon:'⚡',children:[
    {id:21,name:'꿀팁',slug:'quick-tip'},{id:22,name:'탁송위치',slug:'quick-location'},
    {id:23,name:'자유',slug:'quick-free'},{id:24,name:'고민',slug:'quick-worry'},
    {id:25,name:'사건사고',slug:'quick-incident'},
  ]},
  {id:3,name:'배민&배플',slug:'baemin',icon:'🛵',children:[
    {id:31,name:'꿀팁',slug:'baemin-tip'},{id:32,name:'자유',slug:'baemin-free'},
    {id:33,name:'고민',slug:'baemin-worry'},{id:34,name:'사건사고',slug:'baemin-incident'},
  ]},
  {id:4,name:'쿠팡&쿠플',slug:'coupang',icon:'📦',children:[
    {id:41,name:'꿀팁',slug:'coupang-tip'},{id:42,name:'자유',slug:'coupang-free'},
    {id:43,name:'고민',slug:'coupang-worry'},{id:44,name:'사건사고',slug:'coupang-incident'},
  ]},
  {id:5,name:'택시',slug:'taxi',icon:'🚕',children:[
    {id:51,name:'꿀팁',slug:'taxi-tip'},{id:52,name:'자유',slug:'taxi-free'},
    {id:53,name:'고민',slug:'taxi-worry'},
  ]},
  {id:6,name:'화물',slug:'cargo',icon:'🚚',children:[
    {id:61,name:'꿀팁',slug:'cargo-tip'},{id:62,name:'자유',slug:'cargo-free'},
    {id:63,name:'고민',slug:'cargo-worry'},
  ]},
  {id:7,name:'대리운전',slug:'proxy-drive',icon:'🚗',children:[
    {id:71,name:'꿀팁',slug:'proxy-tip'},{id:72,name:'자유',slug:'proxy-free'},
    {id:73,name:'고민',slug:'proxy-worry'},
  ]},
];

function isActivePremium(){
  return userProfile?.is_premium&&userProfile?.premium_until&&new Date(userProfile.premium_until)>new Date();
}
function isActiveMapdongFamily(){
  return userProfile?.is_mapdong_family&&userProfile?.mapdong_family_until&&new Date(userProfile.mapdong_family_until)>new Date();
}
function canAccess(){return isAdmin()||isActivePremium()||isActiveMapdongFamily();}
function isInsuranceCat(){
  return !!CATS.find(c=>c.insuranceOnly&&c.children.some(ch=>ch.id===currentCatId));
}
function isAdmin(){
  return userProfile?.role==='admin'||
    ['kke320001@gmail.com','test12@gmail.com'].includes(currentUser?.email);
}
function canWrite(){
  if(!currentUser) return false;
  if(isAdmin()) return true;           // 관리자는 모든 게시판 글쓰기 가능
  if(!canAccess()) return false;
  if(isInsuranceCat()) return userProfile?.job==='보험';
  return true;
}

async async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){
    currentUser=session.user;
    const {data}=await sb.from('user_profiles').select('*').eq('user_id',currentUser.id).single();
    userProfile=data;
  }
  const params=new URLSearchParams(window.location.search);
  const slug=params.get('cat'),catId=params.get('catId'),catName=params.get('catName')||'게시판';
  if(slug&&catId){currentCatSlug=slug;currentCatId=Number(catId);currentCatName=catName;}
  renderSidebar();
  renderBoard();
}

function renderSidebar(){
  const el=document.getElementById('comm-sidebar');
  let html='';
  CATS.forEach(cat=>{
    const isOpen=cat.children.some(c=>c.slug===currentCatSlug);
    html+=`<div class="cl-parent${isOpen?' open':''}" onclick="toggleCat('${cat.slug}')">
      <span>${cat.icon} ${cat.name}</span><span class="arr">›</span></div>
    <div class="cl-children${isOpen?' open':''}" id="clch-${cat.slug}">`;
    cat.children.forEach(ch=>{
      const active=ch.slug===currentCatSlug?' active':'';
      html+=`<div class="cl-child${active}" onclick="selectCat('${ch.slug}',${ch.id},'${ch.name}')">ㄴ ${ch.name}</div>`;
    });
    html+='</div>';
  });
  el.innerHTML=html;
}

function toggleCat(slug){
  const ch=document.getElementById('clch-'+slug),pr=ch?.previousElementSibling;
  if(!ch)return;
  const open=ch.classList.contains('open');
  document.querySelectorAll('.cl-children.open').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.cl-parent.open').forEach(e=>e.classList.remove('open'));
  if(!open){ch.classList.add('open');pr?.classList.add('open');}
}
function selectCat(slug,id,name){
  currentCatSlug=slug;currentCatId=id;currentCatName=name;currentPage=1;
  window.history.replaceState({},'',`?cat=${slug}&catId=${id}&catName=${encodeURIComponent(name)}`);
  renderSidebar();renderBoard();
}

async async function renderBoard(){
  document.getElementById('board-title').textContent=currentCatName||'게시판';
  document.getElementById('comm-cat-title').textContent=currentCatName||'커뮤니티';
  document.getElementById('post-view').style.display='none';
  document.getElementById('post-write').style.display='none';
  document.getElementById('post-list-view').style.display='block';
  document.getElementById('insurance-notice').style.display=isInsuranceCat()?'block':'none';
  document.getElementById('btn-write').style.display=(canWrite()||isAdmin())?'block':'none';

  const listEl=document.getElementById('post-list');
  if(!currentCatId){listEl.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:40px">카테고리를 선택하세요</div>';return;}
  if(!canAccess()){await renderTitleOnly(listEl);return;}

  listEl.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:20px">로딩 중...</div>';
  const from=(currentPage-1)*PAGE_SIZE,to=from+PAGE_SIZE-1;
  const {data,count}=await sb.from('community_posts')
    .select('id,title,created_at,view_count,like_count,is_pinned,content',{count:'exact'})
    .eq('category_id',currentCatId).eq('is_deleted',false)
    .order('is_pinned',{ascending:false}).order('created_at',{ascending:false})
    .range(from,to);

  if(!data?.length){listEl.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:40px">게시글이 없습니다</div>';return;}
  listEl.innerHTML=data.map(p=>{
    const hasImg=p.content&&p.content.includes('<img');
    return `<div class="post-row" onclick="viewPost(${p.id})">
      <div class="post-title-row">
        ${p.is_pinned?'<span class="post-pin">📌</span>':''}
        <span class="post-title">${escHtml(p.title)}</span>
        ${hasImg?'<span class="post-has-img">🖼</span>':''}
      </div>
      <div class="post-stats">👁 ${p.view_count}&nbsp;❤️ ${p.like_count}</div>
      <div class="post-meta">${new Date(p.created_at).toLocaleDateString('ko-KR')}</div>
    </div>`;
  }).join('');
  renderPagination(count);
}

async function renderTitleOnly(listEl){
  const {data}=await sb.from('community_posts')
    .select('id,title,is_pinned').eq('category_id',currentCatId).eq('is_deleted',false)
    .order('is_pinned',{ascending:false}).order('created_at',{ascending:false}).range(0,29);
  const locked=`<div class="locked-notice"><div class="lock-icon">🔒</div>
    <h3>멤버 전용 게시판</h3><p>맵동가족(990원/월) 또는 프리미엄 회원만<br>게시글 내용을 열람하고 작성할 수 있습니다.</p>
    <button class="lock-upgrade-btn" onclick="window.location.href='index.html'">← 돌아가서 가입하기</button></div>`;
  if(!data?.length){listEl.innerHTML=locked;return;}
  listEl.innerHTML=locked+'<div style="margin-top:12px">'+
    data.map(p=>`<div class="post-title-only">
      ${p.is_pinned?'<span style="color:var(--gold)">📌</span>':''}
      <span class="pt-title">${escHtml(p.title)}</span>
      <span style="margin-left:auto;font-size:.65rem;opacity:.5">🔒</span>
    </div>`).join('')+'</div>';
  document.getElementById('pagination').innerHTML='';
}

function renderPagination(total){
  const pages=Math.ceil(total/PAGE_SIZE);
  const el=document.getElementById('pagination');
  if(pages<=1){el.innerHTML='';return;}
  el.innerHTML=Array.from({length:pages},(_,i)=>
    `<button class="pg-btn${i+1===currentPage?' active':''}" onclick="goPage(${i+1})">${i+1}</button>`).join('');
}
function goPage(p){currentPage=p;renderBoard();window.scrollTo(0,0);}

let _viewingPostId=null, _viewingPostData=null;

async async function viewPost(postId){
  if(!canAccess()){alert('맵동가족 또는 프리미엄 회원만 열람 가능합니다');return;}
  const {data}=await sb.from('community_posts').select('*').eq('id',postId).single();
  if(!data)return;
  _viewingPostId=postId; _viewingPostData=data;
  await sb.from('community_posts').update({view_count:(data.view_count||0)+1}).eq('id',postId);
  document.getElementById('post-list-view').style.display='none';
  document.getElementById('post-write').style.display='none';
  document.getElementById('post-view').style.display='block';
  document.getElementById('pv-title').textContent=data.title;

  // 작성자 여부 / 관리자 여부에 따라 수정·삭제 버튼 표시
  const isOwner = currentUser && data.user_id===currentUser.id;
  const adminOrOwner = isAdmin()||isOwner;
  const metaEl = document.getElementById('pv-meta');
  metaEl.innerHTML = new Date(data.created_at).toLocaleString('ko-KR') +
    (adminOrOwner ? `
      <span style="margin-left:12px;">
        <button onclick="editPost()" style="background:rgba(0,212,255,.1);color:var(--accent);border:1px solid rgba(0,212,255,.3);border-radius:6px;padding:3px 10px;font-size:.7rem;cursor:pointer;margin-right:6px;">✏️ 수정</button>
        <button onclick="deletePost()" style="background:rgba(255,60,110,.1);color:var(--accent2);border:1px solid rgba(255,60,110,.3);border-radius:6px;padding:3px 10px;font-size:.7rem;cursor:pointer;">🗑 삭제</button>
      </span>` : '');

  const contentEl=document.getElementById('pv-content');
  contentEl.innerHTML=data.content||'';
  contentEl.querySelectorAll('img').forEach(img=>{
    img.style.cursor='pointer';
    img.onclick=()=>openLightbox(img.src);
  });
}

async function deletePost(){
  if(!_viewingPostId) return;
  if(!confirm('이 게시글을 삭제하시겠습니까?')) return;
  const {error}=await sb.from('community_posts')
    .update({is_deleted:true}).eq('id',_viewingPostId);
  if(error){alert('삭제 실패: '+error.message);return;}
  showListView(); renderBoard();
}

function editPost(){
  if(!_viewingPostData) return;
  document.getElementById('post-list-view').style.display='none';
  document.getElementById('post-view').style.display='none';
  document.getElementById('post-write').style.display='block';
  document.getElementById('write-title-input').value=_viewingPostData.title||'';
  document.getElementById('write-editor').innerHTML=_viewingPostData.content||'';
  // 등록하기 버튼을 수정 모드로 교체
  const btn=document.getElementById('btn-submit-post');
  btn.textContent='수정 완료';
  btn.onclick=submitEditPost;
}

async function submitEditPost(){
  const title=document.getElementById('write-title-input').value.trim();
  const content=document.getElementById('write-editor').innerHTML.trim();
  if(!title){alert('제목을 입력하세요');return;}
  if(!content){alert('내용을 입력하세요');return;}
  const btn=document.getElementById('btn-submit-post');
  btn.disabled=true; btn.textContent='수정 중...';
  const {error}=await sb.from('community_posts')
    .update({title,content,updated_at:new Date().toISOString()})
    .eq('id',_viewingPostId);
  btn.disabled=false; btn.textContent='수정 완료';
  btn.onclick=submitPost;  // 원래대로 복원
  if(error){alert('수정 실패: '+error.message);return;}
  // 수정 후 다시 보기
  await viewPost(_viewingPostId);
}

function showWriteForm(){
  if(!canWrite()){
    if(isInsuranceCat()&&!isAdmin()) alert('보험 게시판은 보험 자격증 보유자(job=보험)만 글쓰기 가능합니다.');
    else if(!canAccess()) alert('맵동가족 또는 프리미엄 회원만 작성 가능합니다');
    return;
  }
  document.getElementById('post-list-view').style.display='none';
  document.getElementById('post-view').style.display='none';
  document.getElementById('post-write').style.display='block';
  document.getElementById('write-title-input').value='';
  document.getElementById('write-editor').innerHTML='';
}

// ── 이미지 처리 ──
function triggerImgUpload(){
  document.getElementById('img-file-input').value='';
  document.getElementById('img-file-input').click();
}
async function handleImgFiles(files){
  for(const file of Array.from(files)){
    if(!file.type.startsWith('image/')){alert(`${file.name}: 이미지만 가능합니다`);continue;}
    if(file.size>IMG_MAX_BYTES){alert(`${file.name}: 24MB 초과`);continue;}
    await insertImgToEditor(file);
  }
}
async function handlePaste(e){
  const items=e.clipboardData?.items;
  if(!items)return;
  for(const item of Array.from(items)){
    if(item.type.startsWith('image/')){
      e.preventDefault();
      const file=item.getAsFile();
      if(file.size>IMG_MAX_BYTES){alert('24MB 초과 이미지는 붙여넣기 불가');return;}
      await insertImgToEditor(file);
    }
  }
}
async function handleDrop(e){
  e.preventDefault();
  if(e.dataTransfer?.files) await handleImgFiles(e.dataTransfer.files);
}
async function insertImgToEditor(file){
  const dataUrl=await resizeImage(file,IMG_MAX_W,IMG_MAX_H);
  const editor=document.getElementById('write-editor');
  editor.focus();
  const img=document.createElement('img');
  img.src=dataUrl;
  img.style.cssText='max-width:100%;max-height:500px;border-radius:8px;margin:6px 0;display:block;border:1px solid var(--border);cursor:pointer;';
  img.onclick=()=>openLightbox(img.src);
  const sel=window.getSelection();
  if(sel&&sel.rangeCount>0&&editor.contains(sel.anchorNode)){
    const range=sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(img);
    range.setStartAfter(img);range.collapse(true);
    sel.removeAllRanges();sel.addRange(range);
  } else {
    editor.appendChild(img);
  }
}
function resizeImage(file,maxW,maxH){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const src=e.target.result;
      const el=new Image();
      el.onload=()=>{
        let{width:w,height:h}=el;
        if(w<=maxW&&h<=maxH){resolve(src);return;}
        const ratio=Math.min(maxW/w,maxH/h);
        w=Math.round(w*ratio);h=Math.round(h*ratio);
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(el,0,0,w,h);
        resolve(canvas.toDataURL(file.type||'image/jpeg',0.88));
      };
      el.src=src;
    };
    reader.readAsDataURL(file);
  });
}

async function submitPost(){
  const title=document.getElementById('write-title-input').value.trim();
  const editor=document.getElementById('write-editor');
  const rawContent=editor.innerHTML.trim();
  if(!title){alert('제목을 입력하세요');return;}
  if(!rawContent||editor.textContent.trim()===''){alert('내용을 입력하세요');return;}
  if(!currentUser){alert('로그인이 필요합니다');return;}
  if(!currentCatId){alert('카테고리를 선택하세요');return;}
  const btn=document.getElementById('btn-submit-post');
  btn.disabled=true;btn.textContent='등록 중...';
  // 쿠팡 파트너스 광고를 콘텐츠 최상단에 삽입
  const content = COUPANG_AD_HTML + rawContent;
  const {error}=await sb.from('community_posts').insert({
    category_id:currentCatId,user_id:currentUser.id,title,content
  });
  btn.disabled=false;btn.textContent='등록하기';
  if(error){alert('등록 실패: '+error.message);return;}
  showListView();renderBoard();
}

function showListView(){
  document.getElementById('post-list-view').style.display='block';
  document.getElementById('post-view').style.display='none';
  document.getElementById('post-write').style.display='none';
}
function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('img-lightbox').classList.add('show');
}
function closeLightbox(){
  document.getElementById('img-lightbox').classList.remove('show');
  document.getElementById('lightbox-img').src='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
document.getElementById('img-lightbox').addEventListener('click',e=>{if(e.target===e.currentTarget)closeLightbox();});
function backToQuiz(){window.location.href='index.html';}
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
