<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapDong 커뮤니티</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:#1e3a5f;--accent:#00d4ff;--accent2:#ff3c6e;--accent3:#39ff14;--text:#e8f4fd;--text-dim:#7a9bb5;--gold:#ffd700;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;display:flex;flex-direction:column;}

/* ── 헤더 ── */
#comm-header{height:52px;background:var(--surface);border-bottom:2px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:100;}
.comm-logo{font-family:'Black Han Sans',sans-serif;font-size:1.2rem;color:var(--accent);letter-spacing:2px;}
.comm-logo span{color:var(--accent2);}
#btn-back-quiz{background:linear-gradient(135deg,#a29bfe,#6c5ce7);border:none;border-radius:8px;padding:6px 14px;font-size:.82rem;font-weight:700;color:#fff;cursor:pointer;}
.comm-cat-title{font-size:.9rem;color:var(--text-dim);}
/* ── 유저 칩 드롭다운 ── */
#comm-user-area{margin-left:auto;display:flex;align-items:center;gap:10px;position:relative;}
#comm-user-chip{display:none;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 12px 4px 6px;cursor:pointer;transition:border-color .2s;}
#comm-user-chip:hover{border-color:var(--accent);}
#comm-user-chip.visible{display:flex;}
.comm-user-avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#000;}
.comm-user-nick{font-size:.75rem;font-weight:600;color:var(--text);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#comm-user-dropdown{position:absolute;top:44px;right:0;background:var(--surface);border:1px solid rgba(0,212,255,.15);border-radius:12px;padding:6px;min-width:180px;z-index:200;display:none;box-shadow:-4px 8px 30px rgba(0,0,0,.5);}
#comm-user-dropdown.show{display:block;}
.cdd-btn{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text-dim);padding:9px 12px;border-radius:8px;font-size:.82rem;font-family:'Noto Sans KR',sans-serif;cursor:pointer;transition:all .15s;}
.cdd-btn:hover{background:var(--surface2);color:var(--text);}
.cdd-sep{height:1px;background:var(--border);margin:4px 0;}

/* ── 레이아웃 ── */
#comm-body{display:flex;flex:1;min-height:0;overflow:hidden;}
#comm-left{width:200px;flex-shrink:0;background:var(--surface);border-right:2px solid var(--border);overflow-y:auto;padding:10px 0;scrollbar-width:thin;}
#comm-left::-webkit-scrollbar{width:3px;}
#comm-left::-webkit-scrollbar-thumb{background:var(--border);}
.cl-header{padding:6px 12px;font-size:.55rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.cl-parent{padding:7px 12px;font-size:.78rem;font-weight:600;color:var(--text);cursor:pointer;transition:background .15s;user-select:none;display:flex;align-items:center;gap:6px;}
.cl-parent:hover{background:var(--surface2);}
.cl-parent .arr{margin-left:auto;font-size:.6rem;color:var(--text-dim);transition:transform .2s;}
.cl-parent.open .arr{transform:rotate(90deg);}
.cl-children{display:none;}
.cl-children.open{display:block;}
.cl-child{padding:6px 12px 6px 26px;font-size:.73rem;color:var(--text-dim);cursor:pointer;transition:background .15s,color .15s;}
.cl-child:hover{background:var(--surface2);color:var(--text);}
.cl-child.active{color:var(--accent);background:rgba(0,212,255,.08);}

/* ── 메인 ── */
#comm-main{flex:1;overflow-y:auto;padding:20px;scrollbar-width:thin;}
#comm-main::-webkit-scrollbar{width:4px;}
#comm-main::-webkit-scrollbar-thumb{background:var(--border);}

/* ── 게시판 상단 툴바 ── */
.board-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.board-title{font-size:1.1rem;font-weight:700;color:var(--text);}
.board-write-btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:7px 14px;font-size:.8rem;font-weight:700;cursor:pointer;}
.page-size-select{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:5px 8px;font-size:.75rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

/* ── 검색바 ── */
.search-bar{display:flex;gap:6px;margin-bottom:12px;}
.search-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:.83rem;font-family:'Noto Sans KR',sans-serif;outline:none;}
.search-input:focus{border-color:var(--accent);}
.search-type-select{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:8px 10px;font-size:.78rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;outline:none;}
.search-btn{background:var(--accent);color:#000;border:none;border-radius:8px;padding:8px 14px;font-size:.78rem;font-weight:700;cursor:pointer;}
.search-reset{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:8px 10px;font-size:.78rem;cursor:pointer;}

/* ── 게시글 목록 ── */
.post-row{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;transition:border-color .15s;margin-bottom:4px;}
.post-row:hover{border-color:var(--accent);}
.post-row.best{border-color:var(--gold);background:rgba(255,215,0,.05);}
.post-title-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.post-title{font-size:.88rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.post-pin{color:var(--gold);font-size:.75rem;}
.post-best{color:var(--gold);font-size:.9rem;}
.post-has-img{font-size:.65rem;color:var(--accent);}
.post-bottom{display:flex;align-items:center;gap:10px;}
.post-meta{font-size:.68rem;color:var(--text-dim);}
.post-stats{font-size:.68rem;color:var(--text-dim);margin-left:auto;display:flex;gap:8px;}
/* 닉네임 + 등급 배지 */
.post-author{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--text-dim);cursor:pointer;}
.post-author:hover{color:var(--accent);}
.grade-badge{font-size:.6rem;padding:1px 5px;border-radius:4px;font-weight:700;}
.grade-admin{background:linear-gradient(135deg,#ff3c6e,#a00);color:#fff;}
.grade-premium{background:var(--gold);color:#000;}
.grade-insurance{background:linear-gradient(135deg,#00b894,#00cec9);color:#fff;}
.grade-family{background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:#fff;}

/* ── 잠금 안내 ── */
.locked-notice{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:30px;text-align:center;}
.locked-notice .lock-icon{font-size:2.5rem;margin-bottom:12px;}
.locked-notice h3{color:var(--text);margin-bottom:8px;}
.locked-notice p{color:var(--text-dim);font-size:.85rem;line-height:1.7;}
.lock-upgrade-btn{display:inline-block;margin-top:16px;background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:.85rem;font-weight:700;cursor:pointer;}

/* ── 포스트 뷰 ── */
#post-view{display:none;}
.post-view-header{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.post-view-title{font-size:1.2rem;font-weight:700;color:var(--text);margin-bottom:8px;}
.post-view-meta{display:flex;align-items:center;gap:12px;font-size:.72rem;color:var(--text-dim);flex-wrap:wrap;}
.post-view-content{font-size:.88rem;color:var(--text);line-height:1.9;word-break:break-word;margin-bottom:24px;}
.post-view-content img{max-width:100%;max-height:600px;border-radius:8px;cursor:pointer;margin:8px 0;display:block;border:1px solid var(--border);}
#btn-back-list{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:5px 12px;font-size:.78rem;cursor:pointer;margin-bottom:16px;}
#btn-back-list:hover{border-color:var(--accent);color:var(--accent);}

/* ── 좋아요 버튼 ── */
.like-area{display:flex;align-items:center;gap:10px;margin:16px 0;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.like-btn{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:20px;padding:6px 16px;font-size:.82rem;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.like-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.like-btn.liked{border-color:var(--accent2);color:var(--accent2);background:rgba(255,60,110,.1);}
.like-count{font-size:.9rem;font-weight:700;color:var(--text);}

/* ── 댓글 ── */
.comment-section{margin-top:20px;}
.comment-header{font-size:.85rem;font-weight:700;color:var(--text);margin-bottom:12px;}
.comment-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;}
.comment-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.comment-author{font-size:.75rem;font-weight:600;color:var(--text);cursor:pointer;}
.comment-author:hover{color:var(--accent);}
.comment-time{font-size:.65rem;color:var(--text-dim);margin-left:auto;}
.comment-del-btn{font-size:.65rem;color:var(--accent2);background:none;border:none;cursor:pointer;padding:0 4px;}
.comment-body{font-size:.82rem;color:var(--text);line-height:1.7;white-space:pre-wrap;}
.comment-input-area{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.comment-textarea{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:.83rem;resize:vertical;min-height:80px;outline:none;}
.comment-textarea:focus{border-color:var(--accent);}
.comment-submit-btn{align-self:flex-end;background:var(--accent);color:#000;border:none;border-radius:8px;padding:7px 18px;font-size:.8rem;font-weight:700;cursor:pointer;}
.comment-locked{font-size:.78rem;color:var(--text-dim);padding:10px;background:var(--surface2);border-radius:8px;text-align:center;}

/* ── 글쓰기 폼 ── */
#post-write{display:none;}
.write-form-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:14px;}
.write-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:.85rem;outline:none;}
.write-input:focus{border-color:var(--accent);}
.editor-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;}
.toolbar-btn{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.toolbar-btn:hover{border-color:var(--accent);color:var(--accent);}
.img-size-info{font-size:.68rem;color:var(--text-dim);margin-left:auto;}
#write-editor{width:100%;min-height:280px;max-height:60vh;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:.88rem;line-height:1.8;outline:none;overflow-y:auto;word-break:break-word;}
#write-editor:focus{border-color:var(--accent);}
#write-editor:empty::before{content:attr(placeholder);color:var(--text-dim);pointer-events:none;}
#write-editor img{max-width:100%;max-height:500px;border-radius:8px;margin:6px 0;display:block;border:1px solid var(--border);}
.write-actions{display:flex;gap:10px;margin-top:12px;justify-content:flex-end;}
.btn-submit{background:var(--accent);color:#000;border:none;border-radius:8px;padding:9px 22px;font-size:.85rem;font-weight:700;cursor:pointer;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
.btn-cancel-write{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:9px 16px;font-size:.85rem;cursor:pointer;}

/* ── 페이지네이션 ── */
.pagination{display:flex;gap:6px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.pg-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:5px 10px;font-size:.78rem;cursor:pointer;transition:all .15s;}
.pg-btn:hover,.pg-btn.active{border-color:var(--accent);color:var(--accent);}

/* ── 제목만 보기 ── */
.post-title-only{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.85rem;display:flex;align-items:center;gap:6px;}
.post-title-only .pt-title{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── 보험 안내 ── */
.insurance-notice{background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.25);border-radius:10px;padding:10px 14px;font-size:.75rem;color:var(--gold);margin-bottom:12px;line-height:1.7;}

/* ── 이미지 라이트박스 ── */
#img-lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99999;align-items:center;justify-content:center;}
#img-lightbox.show{display:flex;}
#lightbox-img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:8px;}
#lightbox-close{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;width:40px;height:40px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#lightbox-close:hover{background:rgba(255,60,110,.6);}

/* ── 회원정보 팝업 ── */
#profile-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:90000;align-items:center;justify-content:center;padding:16px;}
#profile-modal.show{display:flex;}
.profile-card{background:var(--surface2);border:1px solid var(--border);border-radius:16px;max-width:420px;width:100%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;}
.profile-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.profile-tab{flex:1;padding:10px;font-size:.8rem;text-align:center;cursor:pointer;color:var(--text-dim);transition:all .15s;border-bottom:2px solid transparent;}
.profile-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.profile-body{padding:20px;overflow-y:auto;flex:1;}
.profile-avatar-area{text-align:center;margin-bottom:16px;}
.profile-avatar-circle{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:#000;margin:0 auto 8px;}
.profile-nickname{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:4px;}
.profile-grade{font-size:.75rem;color:var(--text-dim);}
.profile-stat-row{display:flex;gap:8px;margin-top:12px;}
.profile-stat-btn{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer;transition:border-color .15s;}
.profile-stat-btn:hover{border-color:var(--accent);}
.profile-stat-btn .num{font-size:1.1rem;font-weight:700;color:var(--accent);}
.profile-stat-btn .label{font-size:.68rem;color:var(--text-dim);margin-top:2px;}
.profile-close-btn{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:8px 20px;font-size:.82rem;cursor:pointer;width:100%;margin-top:14px;}
.profile-close-btn:hover{border-color:var(--accent2);color:var(--accent2);}
.profile-post-list{display:flex;flex-direction:column;gap:6px;margin-top:4px;}
.profile-post-item{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;cursor:pointer;font-size:.8rem;color:var(--text);}
.profile-post-item:hover{border-color:var(--accent);}
.profile-post-meta{font-size:.65rem;color:var(--text-dim);margin-top:3px;}
.rank-placeholder{text-align:center;padding:30px;color:var(--text-dim);font-size:.85rem;}

@media(max-width:640px){#comm-left{width:160px;}#comm-main{padding:12px;}}
</style>
</head>
<body>

<div id="comm-header">
  <div class="comm-logo">Map<span>Dong</span></div>
  <div class="comm-cat-title" id="comm-cat-title">커뮤니티</div>
  <div id="comm-user-area">
    <button id="btn-back-quiz" onclick="backToQuiz()">🗺 퀴즈로 돌아가기</button>
    <!-- 닉네임 드롭다운 -->
    <div id="comm-user-chip" onclick="toggleCommDD(event)">
      <div class="comm-user-avatar" id="comm-avatar">?</div>
      <span class="comm-user-nick" id="comm-nick">-</span>
      <span style="font-size:.6rem;color:var(--text-dim)">▾</span>
    </div>
    <div id="comm-user-dropdown">
      <button class="cdd-btn" onclick="openMyPage()">📋 내가 쓴 글·댓글</button>
      <div class="cdd-sep"></div>
      <button class="cdd-btn" onclick="backToQuiz()">🗺 퀴즈로 돌아가기</button>
    </div>
  </div>
</div>

<!-- 내 커뮤니티 정보 페이지 -->
<div id="my-page" style="display:none;flex:1;overflow-y:auto;padding:24px;max-width:760px;margin:0 auto;width:100%;box-sizing:border-box;">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
    <button onclick="closeMyPage()" style="background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:6px;padding:5px 12px;font-size:.78rem;cursor:pointer;">← 게시판으로</button>
    <div style="font-size:1rem;font-weight:700;color:var(--text);">📋 내 커뮤니티 활동</div>
  </div>
  <!-- 탭 -->
  <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;">
    <div id="my-tab-posts" onclick="switchMyTab('posts')"
      style="padding:10px 20px;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--accent);border-bottom:2px solid var(--accent);">
      ✍️ 내가 쓴 글
    </div>
    <div id="my-tab-comments" onclick="switchMyTab('comments')"
      style="padding:10px 20px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--text-dim);border-bottom:2px solid transparent;">
      💬 내가 쓴 댓글
    </div>
  </div>
  <div id="my-page-list"></div>
  <div class="pagination" id="my-pagination"></div>
</div>

<div id="comm-body">
  <div id="comm-left">
    <div class="cl-header">카테고리</div>
    <div id="comm-sidebar"></div>
  </div>

  <div id="comm-main">
    <!-- 목록 -->
    <div id="post-list-view">
      <div class="board-toolbar">
        <div class="board-title" id="board-title">게시판</div>
        <select class="page-size-select" onchange="changePageSize(this.value)">
          <option value="10">10개씩</option>
          <option value="20" selected>20개씩</option>
          <option value="30">30개씩</option>
          <option value="40">40개씩</option>
          <option value="50">50개씩</option>
        </select>
        <button class="board-write-btn" id="btn-write" onclick="showWriteForm()" style="display:none">✏️ 글쓰기</button>
      </div>
      <div class="search-bar">
        <select class="search-type-select" id="search-type">
          <option value="all">제목+내용</option>
          <option value="title">제목만</option>
          <option value="content">내용만</option>
        </select>
        <input class="search-input" id="search-input" placeholder="검색어 입력..." onkeydown="if(event.key==='Enter')doSearch()">
        <button class="search-btn" onclick="doSearch()">🔍</button>
        <button class="search-reset" onclick="resetSearch()">✕</button>
      </div>
      <div id="insurance-notice" class="insurance-notice" style="display:none">
        🛡️ 이 게시판은 <strong>보험 자격증 보유자</strong>만 글쓰기 가능합니다.
      </div>
      <div id="post-list"></div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- 상세 -->
    <div id="post-view" style="display:none;">
      <button id="btn-back-list" onclick="showListView()">← 목록으로</button>
      <div class="post-view-header">
        <div class="post-view-title" id="pv-title"></div>
        <div class="post-view-meta" id="pv-meta"></div>
      </div>

// 글쓰기/댓글 가능: 맵동가족, 프리미엄, 보험등급, 관리자 (일반회원 불가)
function canAccess(){return isAdmin()||isActivePremium()||isActiveMapdongFamily()||isInsuranceUser();}

function isInsuranceCat(){return!!CATS.find(c=>c.insuranceOnly&&c.children.some(ch=>ch.id===currentCatId));}

function canWrite(){
  if(!currentUser)return false;
  if(isAdmin())return true;

  if(isInsuranceCat())return isInsuranceUser();

}

function gradeBadge(profile){
  if(!profile)return'';
  if(profile.role==='admin')return'<span class="grade-badge grade-admin">관리자</span>';
  if(profile.is_premium&&new Date(profile.premium_until)>new Date())return'<span class="grade-badge grade-premium">프리미엄</span>';
  if(profile.job==='보험')return'<span class="grade-badge grade-insurance">보험</span>';
  if(profile.is_mapdong_family&&new Date(profile.mapdong_family_until)>new Date())return'<span class="grade-badge grade-family">맵동가족</span>';
  return'';
}

function toggleCat(slug){
  const ch=document.getElementById('clch-'+slug),pr=ch?.previousElementSibling;

  const open=ch.classList.contains('open');
  document.querySelectorAll('.cl-children.open').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.cl-parent.open').forEach(e=>e.classList.remove('open'));
  if(!open){ch.classList.add('open');pr?.classList.add('open');}
}

async function renderBoard(){
  document.getElementById('board-title').textContent=currentCatName||'게시판';
  document.getElementById('comm-cat-title').textContent=currentCatName||'커뮤니티';
  document.getElementById('post-view').style.display='none';

  document.getElementById('insurance-notice').style.display=isInsuranceCat()?'block':'none';
  document.getElementById('btn-write').style.display=(canWrite()||isAdmin())?'block':'none';

  const listEl=document.getElementById('post-list');
  if(!currentCatId){listEl.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:40px">카테고리를 선택하세요</div>';return;}
  if(!canAccess()){await renderTitleOnly(listEl);return;}

  listEl.innerHTML='<div style="color:var(--text-dim);text-align:center;padding:20px">로딩 중...</div>';
  const from=(currentPage-1)*PAGE_SIZE,to=from+PAGE_SIZE-1;

  let query=sb.from('community_posts')
    .select('id,title,created_at,view_count,like_count,is_pinned,content,user_id',{count:'exact'})
    .eq('category_id',currentCatId).eq('is_deleted',false);

  // 검색
  if(searchKeyword){
    if(searchType==='title')query=query.ilike('title','%'+searchKeyword+'%');
    else if(searchType==='content')query=query.ilike('content','%'+searchKeyword+'%');
    else query=query.or(`title.ilike.%${searchKeyword}%,content.ilike.%${searchKeyword}%`);
  }

  const {data,count}=await query
    .order('is_pinned',{ascending:false}).order('created_at',{ascending:false})
    .range(from,to);

  if(!data?.length){
    listEl.innerHTML=`<div style="color:var(--text-dim);text-align:center;padding:40px">${searchKeyword?'검색 결과가 없습니다':'게시글이 없습니다'}</div>`;
    document.getElementById('pagination').innerHTML='';return;
  }

  // 닉네임 일괄 조회
  const userIds=[...new Set(data.map(p=>p.user_id).filter(Boolean))];
  let profileMap={};
  if(userIds.length){
    const {data:profiles}=await sb.from('user_profiles').select('user_id,nickname,role,is_premium,premium_until,is_mapdong_family,mapdong_family_until,job').in('user_id',userIds);
    if(profiles)profiles.forEach(p=>{profileMap[p.user_id]=p;});
  }

  listEl.innerHTML=data.map(p=>{
    const prof=profileMap[p.user_id]||{};
    const nick=prof.nickname||'(알수없음)';
    const hasImg=p.content&&p.content.includes('<img');
    const isBest=(p.like_count||0)>=BEST_THRESHOLD;
    return `<div class="post-row${isBest?' best':''}" onclick="viewPost(${p.id})">
      <div class="post-title-row">
        ${p.is_pinned?'<span class="post-pin">📌</span>':''}
        ${isBest?'<span class="post-best" title="베스트 글">👑</span>':''}
        <span class="post-title">${escHtml(p.title)}</span>
        ${hasImg?'<span class="post-has-img">🖼</span>':''}
      </div>
      <div class="post-bottom">
        <span class="post-author" onclick="event.stopPropagation();openProfile('${p.user_id}')">
          ${gradeBadge(prof)} ${escHtml(nick)}
        </span>
        <span class="post-meta">${new Date(p.created_at).toLocaleDateString('ko-KR')}</span>
        <div class="post-stats"><span>👁 ${p.view_count}</span><span>❤️ ${p.like_count||0}</span></div>
      </div>
    </div>`;
  }).join('');
  renderPagination(count);
}

    border-radius:14px;padding:16px 24px;text-align:center;z-index:99999;
    box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:280px;`;
  t.innerHTML=`<div style="font-size:1.3rem;margin-bottom:6px;">🔒</div>
    <div style="font-size:.88rem;color:#e8f4fd;font-weight:700;margin-bottom:4px;">멤버 전용 콘텐츠</div>

  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

function renderPagination(total){
  const pages=Math.ceil(total/PAGE_SIZE);
  const el=document.getElementById('pagination');
  if(pages<=1){el.innerHTML='';return;}
  let html='';
  if(currentPage>1)html+=`<button class="pg-btn" onclick="goPage(${currentPage-1})">‹</button>`;
  for(let i=1;i<=pages;i++)html+=`<button class="pg-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  if(currentPage<pages)html+=`<button class="pg-btn" onclick="goPage(${currentPage+1})">›</button>`;
  el.innerHTML=html;
}
function goPage(p){currentPage=p;renderBoard();window.scrollTo(0,0);}

// ── 게시글 보기 ──
async function viewPost(postId){
  // 글 내용 열람: 맵동가족/프리미엄/관리자만 (일반회원/보험등급은 제목만)
  if(!canReadContent()){showContentLocked();return;}
  const {data}=await sb.from('community_posts').select('*').eq('id',postId).single();
  if(!data)return;
  _viewingPostId=postId;_viewingPostData=data;
  await sb.from('community_posts').update({view_count:(data.view_count||0)+1}).eq('id',postId);

  // 작성자 프로필
  const {data:prof}=await sb.from('user_profiles').select('*').eq('user_id',data.user_id).single();
  const nick=prof?.nickname||'(알수없음)';

  document.getElementById('post-list-view').style.display='none';
  document.getElementById('post-write').style.display='none';
  document.getElementById('post-view').style.display='block';
  document.getElementById('pv-title').textContent=data.title;

  const isOwner=currentUser&&data.user_id===currentUser.id;
  const adminOrOwner=isAdmin()||isOwner;
  document.getElementById('pv-meta').innerHTML=
    `<span class="post-author" onclick="openProfile('${data.user_id}')">${gradeBadge(prof)} ${escHtml(nick)}</span>` +

async function toggleLike(){

async function renderComments(postId){

  document.getElementById('comment-count').textContent=comments?.length||0;

  } else {
    // 댓글 작성자 닉네임 일괄 조회
    const uids=[...new Set(comments.map(c=>c.user_id).filter(Boolean))];
    let pmap={};
    if(uids.length){const {data:profs}=await sb.from('user_profiles').select('user_id,nickname,role,is_premium,premium_until,is_mapdong_family,mapdong_family_until,job').in('user_id',uids);if(profs)profs.forEach(p=>{pmap[p.user_id]=p;});}

          <span class="comment-author" onclick="openProfile('${c.user_id}')">${gradeBadge(cp)} ${escHtml(cn)}</span>
          <span class="comment-time">${new Date(c.created_at).toLocaleString('ko-KR')}</span>

        </div>
        <div class="comment-body">${escHtml(c.content)}</div>
      </div>`;
    }).join('');
  }

  const inputEl=document.getElementById('comment-input-area');
  if(canComment()){
    inputEl.innerHTML=`<div class="comment-input-area">
      <textarea class="comment-textarea" id="comment-text" placeholder="댓글을 입력하세요..."></textarea>
      <button class="comment-submit-btn" onclick="submitComment()">댓글 등록</button>

    inputEl.innerHTML=`<div class="comment-locked">💬 맵동가족·프리미엄·보험자격증 회원만 댓글을 달 수 있습니다.</div>`;

function triggerImgUpload(){document.getElementById('img-file-input').value='';document.getElementById('img-file-input').click();}
async function handleImgFiles(files){for(const f of Array.from(files)){if(!f.type.startsWith('image/')){alert(`${f.name}: 이미지만`);continue;}if(f.size>IMG_MAX_BYTES){alert(`${f.name}: 24MB 초과`);continue;}await insertImgToEditor(f);}}
async function handlePaste(e){const items=e.clipboardData?.items;if(!items)return;for(const item of Array.from(items)){if(item.type.startsWith('image/')){e.preventDefault();const f=item.getAsFile();if(f.size>IMG_MAX_BYTES){alert('24MB 초과');return;}await insertImgToEditor(f);}}}
async function handleDrop(e){e.preventDefault();if(e.dataTransfer?.files)await handleImgFiles(e.dataTransfer.files);}
async function insertImgToEditor(file){
  const dataUrl=await resizeImage(file,IMG_MAX_W,IMG_MAX_H);
  const editor=document.getElementById('write-editor');editor.focus();
  const img=document.createElement('img');
  img.src=dataUrl;img.style.cssText='max-width:100%;max-height:500px;border-radius:8px;margin:6px 0;display:block;border:1px solid var(--border);cursor:pointer;';
  img.onclick=()=>openLightbox(img.src);
  const sel=window.getSelection();
  if(sel&&sel.rangeCount>0&&editor.contains(sel.anchorNode)){const range=sel.getRangeAt(0);range.deleteContents();range.insertNode(img);range.setStartAfter(img);range.collapse(true);sel.removeAllRanges();sel.addRange(range);}
  else editor.appendChild(img);
}
function resizeImage(file,maxW,maxH){return new Promise(resolve=>{const reader=new FileReader();reader.onload=e=>{const src=e.target.result;const el=new Image();el.onload=()=>{let{width:w,height:h}=el;if(w<=maxW&&h<=maxH){resolve(src);return;}const ratio=Math.min(maxW/w,maxH/h);w=Math.round(w*ratio);h=Math.round(h*ratio);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(el,0,0,w,h);resolve(canvas.toDataURL(file.type||'image/jpeg',0.88));};el.src=src;};reader.readAsDataURL(file);});}

function renderMyPagination(total){
  const pages=Math.ceil(total/MY_PAGE_SIZE);
  const el=document.getElementById('my-pagination');
  if(pages<=1){el.innerHTML='';return;}
  let html='';
  if(_myPage>1)html+=`<button class="pg-btn" onclick="goMyPage(${_myPage-1})">‹</button>`;
  for(let i=1;i<=pages;i++)html+=`<button class="pg-btn${i===_myPage?' active':''}" onclick="goMyPage(${i})">${i}</button>`;
  if(_myPage<pages)html+=`<button class="pg-btn" onclick="goMyPage(${_myPage+1})">›</button>`;
  el.innerHTML=html;
}
function goMyPage(p){_myPage=p;loadMyPage();window.scrollTo(0,0);}

function backToQuiz(){window.location.href='index.html';}
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
