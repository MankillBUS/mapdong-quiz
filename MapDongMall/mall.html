<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MapDong Mall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
/* ── 디자인 토큰 (index.html 동일) ── */
:root{
  --bg:#0a0e1a; --surface:#111827; --surface2:#1a2235;
  --border:#1e3a5f; --accent:#00d4ff; --accent2:#ff3c6e;
  --accent3:#39ff14; --text:#e8f4fd; --text-dim:#7a9bb5;
  --gold:#ffd700;
  --mall-primary:#00d4ff; --mall-secondary:#ff3c6e;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
a{color:inherit;text-decoration:none;}
button{cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
img{max-width:100%;}

/* ── 상단 헤더 ── */
#mall-header{
  position:sticky;top:0;z-index:1000;
  background:rgba(10,14,26,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  padding:0 20px;height:60px;
}
#mall-logo{
  font-family:'Black Han Sans',sans-serif;
  font-size:1.4rem;color:var(--accent);
  text-shadow:0 0 12px rgba(0,212,255,.4);
  white-space:nowrap;cursor:pointer;
}
#mall-logo span{color:var(--accent2);}
#mall-search-wrap{flex:1;max-width:480px;margin:0 auto;position:relative;}
#mall-search{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:24px;padding:9px 44px 9px 18px;
  font-size:.88rem;font-family:'Noto Sans KR',sans-serif;outline:none;
  transition:border-color .2s;
}
#mall-search:focus{border-color:var(--accent);}
#mall-search::placeholder{color:var(--text-dim);}
.search-ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:1rem;pointer-events:none;}
#mall-header-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.hbtn{
  background:none;border:1px solid var(--border);color:var(--text-dim);
  border-radius:8px;padding:7px 13px;font-size:.8rem;
  display:flex;align-items:center;gap:5px;transition:all .2s;white-space:nowrap;
}
.hbtn:hover{border-color:var(--accent);color:var(--accent);}
.hbtn.cart-btn{position:relative;}
.cart-badge{
  position:absolute;top:-5px;right:-5px;
  background:var(--accent2);color:#fff;border-radius:50%;
  width:18px;height:18px;font-size:.65rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  display:none;
}
.cart-badge.show{display:flex;}
#btn-admin-panel{background:linear-gradient(135deg,#ff3c6e,#a00);border:none;color:#fff;border-radius:8px;padding:7px 13px;font-size:.8rem;}
/* 번역 버튼 그룹 */
#translate-group{display:flex;gap:4px;}
.tbtn{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text-dim);border-radius:6px;padding:5px 9px;
  font-size:.72rem;transition:all .2s;
}
.tbtn:hover,.tbtn.active{background:var(--accent);color:#000;border-color:var(--accent);}

/* ── 카테고리 탭 ── */
#mall-cats{
  display:flex;gap:6px;padding:10px 20px;
  border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;background:var(--surface);
}
#mall-cats::-webkit-scrollbar{display:none;}
.cat-tab{
  background:none;border:1px solid var(--border);color:var(--text-dim);
  border-radius:20px;padding:6px 16px;font-size:.82rem;white-space:nowrap;
  transition:all .2s;
}
.cat-tab:hover{border-color:var(--accent);color:var(--accent);}
.cat-tab.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}

/* ── 공지 배너 ── */
#mall-notice{
  background:linear-gradient(90deg,rgba(0,212,255,.08),rgba(255,60,110,.08));
  border-bottom:1px solid var(--border);
  padding:8px 20px;font-size:.8rem;color:var(--text-dim);
  display:none;
}
#mall-notice.show{display:block;}

/* ── 메인 레이아웃 ── */
#mall-main{padding:20px;max-width:1280px;margin:0 auto;}

/* ── 상품 그리드 ── */
#product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:16px;
}
.prod-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.prod-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,212,255,.12);}
.prod-thumb{width:100%;aspect-ratio:1;object-fit:cover;background:var(--surface2);}
.prod-thumb-empty{width:100%;aspect-ratio:1;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:var(--text-dim);}
.prod-info{padding:12px;}
.prod-name{font-size:.88rem;font-weight:500;line-height:1.4;margin-bottom:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.prod-price-wrap{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.prod-sale-price{font-size:1.1rem;font-weight:700;color:var(--text);}
.prod-origin-price{font-size:.78rem;color:var(--text-dim);text-decoration:line-through;}
.prod-discount{font-size:.78rem;color:var(--accent2);font-weight:700;}
.prod-ship{font-size:.72rem;color:var(--accent3);margin-top:4px;}
.prod-sold{font-size:.72rem;color:var(--text-dim);margin-top:2px;}
.prod-out{font-size:.75rem;color:var(--accent2);font-weight:700;margin-top:4px;}

/* ── 상품 상세 페이지 ── */
#page-detail{display:none;padding:20px;max-width:900px;margin:0 auto;}
.detail-back{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--text-dim);font-size:.85rem;margin-bottom:18px;cursor:pointer;
}
.detail-back:hover{color:var(--accent);}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
/* 슬라이드쇼 */
.slide-wrap{position:relative;background:var(--surface2);border-radius:14px;overflow:hidden;aspect-ratio:1;user-select:none;}
.slide-img{width:100%;height:100%;object-fit:cover;transition:opacity .25s;}
.slide-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.55);border:none;color:#fff;
  width:36px;height:36px;border-radius:50%;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;transition:background .2s;
}
.slide-btn:hover{background:rgba(0,212,255,.4);}
.slide-btn.prev{left:10px;} .slide-btn.next{right:10px;}
.slide-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;}
.slide-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer;transition:background .2s;}
.slide-dot.active{background:var(--accent);}
/* 상세 우측 */
.detail-right{display:flex;flex-direction:column;gap:16px;}
.detail-name{font-size:1.3rem;font-weight:700;line-height:1.4;}
.detail-price-block{background:var(--surface2);border-radius:10px;padding:14px 16px;}
.dp-sale{font-size:1.6rem;font-weight:700;}
.dp-origin{font-size:.85rem;color:var(--text-dim);text-decoration:line-through;margin-top:2px;}
.dp-discount{font-size:.85rem;color:var(--accent2);font-weight:700;}
/* 옵션 선택 */
.option-section{background:var(--surface2);border-radius:10px;padding:14px 16px;}
.option-title{font-size:.82rem;color:var(--text-dim);margin-bottom:8px;font-weight:500;}
.option-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.opt-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  border-radius:8px;padding:6px 14px;font-size:.82rem;transition:all .2s;
}
.opt-btn:hover{border-color:var(--accent);color:var(--accent);}
.opt-btn.selected{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700;}
.opt-btn:disabled{opacity:.4;cursor:not-allowed;}
.opt-stock{font-size:.72rem;color:var(--text-dim);margin-top:2px;}
/* PC 부품 선택 */
.pc-parts-wrap{background:var(--surface2);border-radius:10px;padding:14px 16px;}
.pc-part-row{margin-bottom:12px;}
.pc-part-label{font-size:.8rem;color:var(--text-dim);margin-bottom:5px;font-weight:500;}
.pc-part-select{
  width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:8px 12px;font-size:.82rem;
  font-family:'Noto Sans KR',sans-serif;outline:none;
}
.pc-part-select:focus{border-color:var(--accent);}
/* 수량 */
.qty-wrap{display:flex;align-items:center;gap:12px;}
.qty-btn{
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  width:34px;height:34px;border-radius:8px;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.qty-btn:hover{border-color:var(--accent);color:var(--accent);}
.qty-num{font-size:1rem;font-weight:700;min-width:32px;text-align:center;}
/* 구매 버튼 */
.buy-btns{display:flex;gap:10px;}
.btn-cart{
  flex:1;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:10px;padding:13px;font-size:.92rem;font-weight:700;
  transition:all .2s;
}
.btn-cart:hover{border-color:var(--accent);color:var(--accent);}
.btn-buy{
  flex:2;background:linear-gradient(135deg,var(--accent),#0099bb);
  border:none;color:#000;border-radius:10px;padding:13px;font-size:.92rem;font-weight:700;
  transition:all .2s;
}
.btn-buy:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,212,255,.4);}
.btn-buy:disabled,.btn-cart:disabled{opacity:.5;cursor:not-allowed;transform:none;}
/* 배송/원산지 정보 */
.detail-meta{border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:6px;}
.meta-row{display:flex;gap:10px;font-size:.78rem;}
.meta-key{color:var(--text-dim);min-width:70px;}
.meta-val{color:var(--text);}
/* 탭 (상세/리뷰/문의) */
.detail-tabs{display:flex;border-bottom:1px solid var(--border);margin-top:32px;}
.dtab{
  padding:10px 20px;font-size:.88rem;color:var(--text-dim);cursor:pointer;
  border-bottom:2px solid transparent;transition:all .2s;
}
.dtab.active{color:var(--accent);border-bottom-color:var(--accent);}
.detail-body{padding:20px 0;}
.detail-content img{max-width:780px;width:100%;}

/* ── 장바구니 슬라이드 패널 ── */
#cart-panel{
  position:fixed;top:0;right:-380px;width:380px;max-width:100vw;height:100vh;
  background:var(--surface);border-left:1px solid var(--border);
  z-index:2000;transition:right .3s;display:flex;flex-direction:column;
}
#cart-panel.open{right:0;}
#cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1999;display:none;}
#cart-overlay.show{display:block;}
.cart-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.cart-hd h3{font-size:1rem;font-weight:700;}
.cart-close{background:none;border:none;color:var(--text-dim);font-size:1.4rem;}
#cart-list{flex:1;overflow-y:auto;padding:12px;}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.cart-item-img{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--surface2);}
.cart-item-info{flex:1;}
.ci-name{font-size:.85rem;font-weight:500;margin-bottom:3px;}
.ci-opt{font-size:.75rem;color:var(--text-dim);}
.ci-price{font-size:.9rem;font-weight:700;margin-top:4px;}
.ci-qty{display:flex;align-items:center;gap:6px;margin-top:6px;}
.ci-qty-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:24px;height:24px;border-radius:5px;font-size:.85rem;}
.ci-del{background:none;border:none;color:var(--accent2);font-size:.8rem;margin-left:auto;}
.cart-ft{padding:16px 20px;border-top:1px solid var(--border);}
.cart-total{display:flex;justify-content:space-between;font-size:1rem;font-weight:700;margin-bottom:12px;}
.btn-checkout{
  width:100%;background:linear-gradient(135deg,var(--accent),#0099bb);
  border:none;color:#000;border-radius:10px;padding:13px;font-size:.95rem;font-weight:700;
}
.cart-empty{text-align:center;padding:40px;color:var(--text-dim);}

/* ── 주문/마이페이지 ── */
#page-myorder{display:none;padding:20px;max-width:800px;margin:0 auto;}
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;}
.order-no{font-size:.78rem;color:var(--text-dim);margin-bottom:6px;}
.order-status{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.75rem;font-weight:700;}
.status-paid{background:rgba(0,212,255,.15);color:var(--accent);}
.status-preparing{background:rgba(255,215,0,.15);color:var(--gold);}
.status-shipping{background:rgba(57,255,20,.15);color:var(--accent3);}
.status-delivered{background:rgba(57,255,20,.25);color:var(--accent3);}
.status-confirmed{background:rgba(0,212,255,.1);color:var(--accent);}
.status-return_requested,.status-return_reviewing,.status-return_shipping{background:rgba(255,60,110,.15);color:var(--accent2);}
.status-return_completed,.status-cancelled{background:rgba(122,155,181,.1);color:var(--text-dim);}
.order-items{margin:10px 0;font-size:.85rem;}
.order-total{font-size:.95rem;font-weight:700;text-align:right;}
.order-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.oact-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);border-radius:7px;padding:6px 14px;font-size:.78rem;}
.oact-btn:hover{border-color:var(--accent);color:var(--accent);}
.oact-btn.danger{border-color:var(--accent2);color:var(--accent2);}
/* 운송장 조회 */
.track-link{color:var(--accent3);font-size:.78rem;text-decoration:underline;}

/* ── 관리자 패널 ── */
#page-admin{display:none;padding:20px;max-width:1200px;margin:0 auto;}
.admin-grid{display:grid;grid-template-columns:220px 1fr;gap:20px;min-height:calc(100vh - 100px);}
.admin-nav{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;height:fit-content;position:sticky;top:80px;}
.anav-section{font-size:.7rem;color:var(--text-dim);padding:8px 10px 4px;font-weight:700;letter-spacing:.05em;}
.anav-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-radius:8px;color:var(--text-dim);
  font-size:.85rem;cursor:pointer;transition:all .2s;
  position:relative;
}
.anav-item:hover{background:var(--surface2);color:var(--text);}
.anav-item.active{background:rgba(0,212,255,.1);color:var(--accent);}
.anav-badge{
  position:absolute;right:10px;background:var(--accent2);color:#fff;
  border-radius:10px;padding:1px 7px;font-size:.68rem;font-weight:700;
}
.admin-content{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;}
.admin-page{display:none;}
.admin-page.active{display:block;}
/* 관리자 페이지 공통 */
.ap-title{font-size:1.2rem;font-weight:700;margin-bottom:4px;}
.ap-desc{font-size:.78rem;color:var(--text-dim);margin-bottom:20px;}
/* 폼 요소 */
.form-group{margin-bottom:16px;}
.form-label{font-size:.82rem;color:var(--text-dim);margin-bottom:5px;display:block;font-weight:500;}
.form-hint{font-size:.72rem;color:var(--text-dim);margin-top:3px;line-height:1.4;}
.form-input,.form-select,.form-textarea{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:8px;padding:9px 13px;
  font-size:.88rem;font-family:'Noto Sans KR',sans-serif;outline:none;
  transition:border-color .2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);}
.form-textarea{resize:vertical;min-height:100px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
/* 버튼 */
.btn-save{
  background:linear-gradient(135deg,var(--accent),#0099bb);border:none;
  color:#000;border-radius:8px;padding:9px 22px;font-size:.88rem;font-weight:700;
}
.btn-danger{background:rgba(255,60,110,.15);border:1px solid var(--accent2);color:var(--accent2);border-radius:8px;padding:9px 18px;font-size:.85rem;}
.btn-add{background:rgba(57,255,20,.1);border:1px solid var(--accent3);color:var(--accent3);border-radius:8px;padding:7px 16px;font-size:.82rem;}
/* 테이블 */
.admin-table{width:100%;border-collapse:collapse;font-size:.83rem;}
.admin-table th{background:var(--surface2);color:var(--text-dim);padding:9px 12px;text-align:left;font-weight:500;border-bottom:1px solid var(--border);}
.admin-table td{padding:9px 12px;border-bottom:1px solid rgba(30,58,95,.4);vertical-align:middle;}
.admin-table tr:hover td{background:rgba(0,212,255,.03);}
/* 대시보드 카드 */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
.dash-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.dash-num{font-size:1.6rem;font-weight:700;color:var(--accent);}
.dash-label{font-size:.75rem;color:var(--text-dim);margin-top:4px;}
.dash-sub{font-size:.7rem;color:var(--text-dim);margin-top:2px;}
/* 이미지 업로드 */
.img-upload-zone{
  border:2px dashed var(--border);border-radius:10px;
  padding:24px;text-align:center;cursor:pointer;transition:all .2s;
  color:var(--text-dim);font-size:.85rem;
}
.img-upload-zone:hover{border-color:var(--accent);color:var(--accent);}
.thumb-preview-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.thumb-preview{position:relative;width:80px;height:80px;}
.thumb-preview img{width:100%;height:100%;object-fit:cover;border-radius:7px;border:1px solid var(--border);}
.thumb-del{position:absolute;top:-5px;right:-5px;background:var(--accent2);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:.65rem;display:flex;align-items:center;justify-content:center;}
/* 상태 배지 (관리자) */
.status-select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:.75rem;}
/* 반품 금액 청구 버튼 */
.btn-charge{background:rgba(255,215,0,.15);border:1px solid var(--gold);color:var(--gold);border-radius:7px;padding:5px 12px;font-size:.78rem;}
/* 재고 경고 */
.stock-warn{color:var(--accent2);font-weight:700;}
.stock-ok{color:var(--accent3);}

/* ── 결제 모달 ── */
#toss-modal{
  display:none;position:fixed;inset:0;z-index:9000;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.75);
}
#toss-modal.show{display:flex;}
#toss-modal-inner{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;width:100%;max-width:480px;max-height:90vh;
  overflow-y:auto;padding:24px;
}
#toss-modal-close{
  position:absolute;top:14px;right:16px;
  background:none;border:none;color:var(--text-dim);font-size:1.5rem;
}
/* ── 주문서 폼 ── */
#page-checkout{display:none;padding:20px;max-width:800px;margin:0 auto;}
.checkout-grid{display:grid;grid-template-columns:1fr 360px;gap:20px;}
.co-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.co-title{font-size:.95rem;font-weight:700;margin-bottom:14px;}
.co-item-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);}
.co-summary{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;position:sticky;top:80px;height:fit-content;}
.co-sum-row{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:8px;}
.co-sum-total{display:flex;justify-content:space-between;font-size:1.05rem;font-weight:700;border-top:1px solid var(--border);padding-top:12px;margin-top:8px;}

/* ── 로딩 / 빈 상태 ── */
.loading{text-align:center;padding:60px;color:var(--text-dim);}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim);}
.empty-state .emoji{font-size:2.5rem;margin-bottom:10px;}
.empty-state p{font-size:.88rem;}

/* ── 토스트 ── */
#mall-toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.mall-toast-item{
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:10px;padding:10px 20px;
  font-size:.85rem;white-space:nowrap;
  animation:toastIn .25s ease;
}
.mall-toast-item.error{border-color:var(--accent2);color:var(--accent2);}
.mall-toast-item.success{border-color:var(--accent3);color:var(--accent3);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── 반응형 ── */
@media(max-width:768px){
  #mall-header{padding:0 12px;gap:8px;}
  #mall-logo{font-size:1.1rem;}
  #translate-group{display:none;}
  #product-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .detail-grid{grid-template-columns:1fr;}
  .checkout-grid{grid-template-columns:1fr;}
  .co-summary{position:static;}
  .admin-grid{grid-template-columns:1fr;}
  .admin-nav{position:static;}
  .form-row{grid-template-columns:1fr;}
  #cart-panel{width:100vw;}
}
@media(max-width:480px){
  #product-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
  #mall-main{padding:12px;}
}
</style>
</head>
<body>

<!-- 헤더 -->
<header id="mall-header">
  <div id="mall-logo" onclick="Mall.goHome()">MapDong <span>Mall</span></div>
  <div id="mall-search-wrap">
    <input id="mall-search" type="text" placeholder="상품 검색..." data-i18n-ph="search_placeholder" oninput="Mall.search(this.value)">
    <span class="search-ico">🔍</span>
  </div>
  <div id="mall-header-right">
    <!-- 번역 버튼 -->
    <div id="translate-group">
      <button class="tbtn active" data-lang="ko" onclick="applyLang('ko')">KO</button>
      <button class="tbtn" data-lang="en" onclick="applyLang('en')">EN</button>
      <button class="tbtn" data-lang="ja" onclick="applyLang('ja')">JA</button>
      <button class="tbtn" data-lang="th" onclick="applyLang('th')">TH</button>
    </div>
    <button class="hbtn" onclick="Mall.goMyOrders()">📦 <span class="hide-sm" data-i18n="btn_myorder">주문내역</span></button>
    <button class="hbtn cart-btn" onclick="Mall.openCart()">
      🛒 <span class="hide-sm" data-i18n="btn_cart">장바구니</span>
      <span class="cart-badge" id="cart-badge">0</span>
    </button>
    <button id="btn-admin-panel" style="display:none" onclick="Mall.goAdmin()"><span data-i18n="btn_admin">⚙️ 관리자</span></button>
    <button class="hbtn" onclick="Mall.exit()" title="처음으로 돌아가기"><span data-i18n="btn_exit">← 나가기</span></button>
  </div>
</header>

<!-- 공지 -->
<div id="mall-notice"></div>

<!-- 카테고리 탭 -->
<nav id="mall-cats">
  <button class="cat-tab active" data-slug="all" onclick="Mall.selectCat('all')" data-i18n="cat_all">🏠 전체</button>
  <button class="cat-tab" data-slug="computer" onclick="Mall.selectCat('computer')" data-i18n="cat_computer">💻 컴퓨터</button>
  <button class="cat-tab" data-slug="general" onclick="Mall.selectCat('general')" data-i18n="cat_general">📦 일반제품</button>
  <button class="cat-tab" data-slug="fashion" onclick="Mall.selectCat('fashion')" data-i18n="cat_fashion">👗 패션</button>
  <button class="cat-tab" data-slug="book" onclick="Mall.selectCat('book')" data-i18n="cat_book">📚 도서</button>
</nav>

<!-- 메인 (상품 목록) -->
<div id="mall-main">
  <div id="product-grid"><div class="loading">상품을 불러오는 중...</div></div>
</div>

<!-- 상품 상세 -->
<div id="page-detail"></div>

<!-- 주문서 -->
<div id="page-checkout"></div>

<!-- 주문내역 -->
<div id="page-myorder"></div>

<!-- 관리자 -->
<div id="page-admin"></div>

<!-- 장바구니 오버레이 -->
<div id="cart-overlay" onclick="Mall.closeCart()"></div>
<!-- 장바구니 패널 -->
<div id="cart-panel">
  <div class="cart-hd">
    <h3 data-i18n="cart_title">🛒 장바구니</h3>
    <button class="cart-close" onclick="Mall.closeCart()">✕</button>
  </div>
  <div id="cart-list"></div>
  <div class="cart-ft">
    <div class="cart-total"><span data-i18n="cart_total">합계</span><span id="cart-total-price">₩0</span></div>
    <button class="btn-checkout" onclick="Mall.goCheckout()" data-i18n="btn_checkout">주문하기</button>
  </div>
</div>

<!-- 결제 모달 -->
<div id="toss-modal">
  <div id="toss-modal-inner">
    <button id="toss-modal-close" onclick="Mall.closeTossModal()">✕</button>
    <div id="toss-modal-title" style="font-size:1.1rem;font-weight:700;margin-bottom:16px;" data-i18n="btn_pay">결제</div>
    <div id="toss-payment-widget"></div>
    <div id="toss-agreement-widget" style="margin-top:12px;"></div>
    <button id="toss-pay-btn" style="width:100%;background:linear-gradient(135deg,var(--accent),#0099bb);border:none;color:#000;border-radius:10px;padding:13px;font-size:.95rem;font-weight:700;margin-top:14px;" onclick="Mall.requestPayment()" data-i18n="btn_pay">결제하기</button>
  </div>
</div>

<!-- 토스트 -->
<div id="mall-toast"></div>

<!-- 구글 번역 제거 → mall_i18n.js 사용 -->

<script src="mall_i18n.js"></script>
<script src="mall.js"></script>
<script src="mall-admin.js"></script>
</body>
</html>
