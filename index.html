<div id="auth-section">
  <button onclick="signInWithGoogle()">Google로 로그인</button>
  <button onclick="signOut()">로그아웃</button>
  <p id="user-info">로그인되지 않음</p>
</div>

<script>
  async function signInWithGoogle() {
    const { data, error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/quiz'  // 로그인 후 돌아올 페이지
      }
    });
    if (error) console.error('로그인 에러:', error);
  }

  async function signOut() {
    await supabase.auth.signOut();
    updateUserInfo();
  }

  function updateUserInfo() {
    const user = supabase.auth.getUser();
    if (user) {
      document.getElementById('user-info').textContent = `환영합니다, ${user.email}`;
    } else {
      document.getElementById('user-info').textContent = '로그인되지 않음';
    }
  }

  // 페이지 로드 시 사용자 상태 체크
  supabase.auth.onAuthStateChange((event, session) => {
    updateUserInfo();
  });
</script>

let map, allDongs=[], queue=[], cur=null, canAns=true;
let totC=0,totW=0,streak=0,qCnt=0,sessAns=0;
let tempL=[];      // 정답(ok) 임시 레이어
let wrongL=[];     // 오답 정답위치 마커 (수동으로만 제거)

// 시작 화면 태그
document.querySelectorAll('.stag').forEach(t=>{
  t.onclick=()=>{t.classList.toggle('sel');updateCnt();};
});
function updateCnt(){
  const s=document.querySelectorAll('.stag.sel');
  let n=0; s.forEach(t=>{if(DB[t.dataset.r])n+=DB[t.dataset.r].dongs.length;});
  document.getElementById('scnt').textContent=n;
}
updateCnt();

function startQuiz(){
  const s=document.querySelectorAll('.stag.sel');
  if(!s.length){alert('지역을 선택하세요!');return;}
  allDongs=[];
  s.forEach(t=>{
    const r=t.dataset.r;
    if(DB[r])DB[r].dongs.forEach(d=>allDongs.push({...d,rk:r,rn:DB[r].name}));
  });
  document.getElementById('start').style.display='none';
  initMap(); buildFilter(); reshuffle(); nextQ();
}

function initMap(){
  map=L.map('map',{center:[37.55,127.00],zoom:10,scrollWheelZoom:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);
  map.on('click',onMapClick);
  // 모달이 열려있어도 지도 스크롤 줌 항상 동작하도록
  map.scrollWheelZoom.enable();
}

function buildFilter(){
  const w=document.getElementById('rbw'); w.innerHTML='';
  const rs=new Set(allDongs.map(d=>d.rk));
  rs.forEach(r=>{
    if(!DB[r])return;
    const b=document.createElement('button');
    b.className='rb on'; b.textContent=DB[r].name;
    b.style.borderColor=DB[r].color; b.style.color=DB[r].color;
    b.dataset.r=r;
    b.onclick=()=>{
      b.classList.toggle('on');
      if(b.classList.contains('on')){b.style.color=DB[r].color;b.style.borderColor=DB[r].color;}
      else{b.style.color='';b.style.borderColor='';}
    };
    w.appendChild(b);
  });
}

function getActive(){
  const on=new Set([...document.querySelectorAll('.rb.on')].map(b=>b.dataset.r));
  return allDongs.filter(d=>on.has(d.rk));
}

function reshuffle(){
  queue=[...getActive()].sort(()=>Math.random()-.5);
  sessAns=0; updPrg();
}

function nextQ(){
  // ok 모달 확인 버튼에서 호출 — wrongL은 유지
  document.getElementById('moverlay').classList.remove('show');
  document.getElementById('moverlay').classList.remove('no-mode');
  tempL.forEach(l=>{try{map.removeLayer(l);}catch(e){}});
  tempL=[]; canAns=true;
  if(!queue.length)reshuffle();
  cur=queue.pop(); qCnt++;
  document.getElementById('qN').textContent='문제 #'+qCnt;
  document.getElementById('qR').textContent='📍 '+cur.rn+' · '+cur.gu;
  document.getElementById('qD').textContent=cur.d;
  document.getElementById('qH').textContent='💡 '+cur.gu+' 관할 행정동';
  updStats();

  if(!queue.length)reshuffle();
  cur=queue.pop(); qCnt++;
  document.getElementById('qN').textContent='문제 #'+qCnt;
  document.getElementById('qR').textContent='📍 '+cur.rn+' · '+cur.gu;
  document.getElementById('qD').textContent=cur.d;
  document.getElementById('qH').textContent='💡 '+cur.gu+' 관할 행정동';
  updStats();
}

function onMapClick(e){
  if(!cur||!canAns)return;
  canAns=false;
  const dist=getDist(e.latlng.lat,e.latlng.lng,cur.lat,cur.lng);
  if(dist<=1.5)doOk(dist); else doNo(dist);
}

function getDist(a,b,c,d){
  const R=6371,dL=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180;
  const x=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function mkMark(lat,lng,ok){
  const col=ok?'#39ff14':'#ff3c6e';
  const m=L.circleMarker([lat,lng],{radius:13,fillColor:col,color:'#fff',weight:3,fillOpacity:.9}).addTo(map);
  const ico=L.divIcon({className:'',iconAnchor:[0,0],
    html:`<div style="background:${col};color:#000;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;margin-top:-30px;margin-left:14px;">${cur.d}</div>`});
  const lb=L.marker([lat,lng],{icon:ico}).addTo(map);
  if(ok){ tempL.push(m,lb); }
  else  { wrongL.push(m,lb); }
}

function mkCircle(lat,lng){
  const c=L.circle([lat,lng],{radius:1500,color:'#ff3c6e',weight:3,fillColor:'#ff3c6e',fillOpacity:.08,dashArray:'8 4'}).addTo(map);
  wrongL.push(c);
}

function clearAnsMarkers(){
  wrongL.forEach(l=>{try{map.removeLayer(l);}catch(e){}});
  wrongL=[];
  document.getElementById('ans-bar').classList.remove('show');
}

function doOk(dist){
  totC++;streak++;sessAns++;
  addR(true,cur);updStats();updPrg();
  mkMark(cur.lat,cur.lng,true);
  const ov=document.getElementById('moverlay');
  ov.classList.remove('no-mode');
  document.getElementById('mbt-ok').style.display='inline-block';
  document.getElementById('mbt-no').style.display='none';
  const b=document.getElementById('mbox'); b.className='ok';
  document.getElementById('mE').textContent=streak>=5?'🔥':streak>=3?'🎯':'✅';
  document.getElementById('mT').textContent=streak>=5?`연속 ${streak}개 정답!`:'정답입니다!';
  document.getElementById('mD').innerHTML=`<span class="mdn">${cur.rn} ${cur.gu} ${cur.d}</span><br>클릭 위치 기준 <strong>${dist.toFixed(2)}km</strong> · 1.5km 이내`;
  ov.classList.add('show');
}

function doNo(dist){
  totW++;streak=0;sessAns++;
  addR(false,cur);updStats();updPrg();

  // 1) 먼저 지도를 정답 위치로 이동
  map.flyTo([cur.lat,cur.lng],14,{duration:1.2});

  // 2) 이동 완료 후 마커+원 표시 (지도 이동이 끝난 뒤 그려야 선명하게 보임)
  setTimeout(()=>{
    mkMark(cur.lat,cur.lng,false);
    mkCircle(cur.lat,cur.lng);
  }, 400);

  // 3) 오답 모달: 지도 안 가리는 우하단 반투명 패널
  document.getElementById('mbt-ok').style.display='none';
  document.getElementById('mbt-no').style.display='inline-block';
  const ov=document.getElementById('moverlay');
  ov.classList.add('no-mode');
  const b=document.getElementById('mbox'); b.className='no';
  document.getElementById('mE').textContent='❌';
  document.getElementById('mT').textContent='틀렸습니다!';
  document.getElementById('mD').innerHTML=`정답: <span class="mdn">${cur.rn} ${cur.gu} ${cur.d}</span><br>클릭 위치에서 <strong>${dist.toFixed(2)}km</strong> 거리`;
  ov.classList.add('show');
}

function closeNoModal(){
  // 오답 모달 닫기 — 정답위치 표시는 유지, ans-bar 표시
  document.getElementById('moverlay').classList.remove('show');
  document.getElementById('moverlay').classList.remove('no-mode');
  if(wrongL.length>0){
    document.getElementById('ab-dong-name').textContent=cur?cur.d:'';
    document.getElementById('ans-bar').classList.add('show');
  }
  // 다음 문제 준비 (tempL 초기화, canAns 활성화)
  tempL.forEach(l=>{try{map.removeLayer(l);}catch(e){}});
  tempL=[]; canAns=true;
  if(!queue.length)reshuffle();
  cur=queue.pop(); qCnt++;
  document.getElementById('qN').textContent='문제 #'+qCnt;
  document.getElementById('qR').textContent='📍 '+cur.rn+' · '+cur.gu;
  document.getElementById('qD').textContent=cur.d;
  document.getElementById('qH').textContent='💡 '+cur.gu+' 관할 행정동';
  updStats();
}

function focusA(){if(cur)map.flyTo([cur.lat,cur.lng],14,{duration:1.2});}
function resetV(){map.flyTo([37.55,127.00],10,{duration:1});}
function skipQ(){
  if(cur){addR(false,cur,true);totW++;streak=0;sessAns++;updStats();updPrg();}
  nextQ();
}

function updStats(){
  document.getElementById('sQ').textContent=qCnt;
  document.getElementById('sC').textContent=totC;
  document.getElementById('sW').textContent=totW;
  const t=totC+totW;
  document.getElementById('sR').textContent=t?Math.round(totC/t*100)+'%':'-';
  document.getElementById('sS').textContent=streak;
}
function updPrg(){
  const tot=getActive().length||1;
  const p=Math.min(Math.round(sessAns/tot*100),100);
  document.getElementById('pT').textContent=sessAns+' / '+tot;
  document.getElementById('pF').style.width=p+'%';
}
function addR(ok,q,skip){
  const l=document.getElementById('rl');
  const e=document.createElement('div');
  e.className='ri';
  e.innerHTML=`<div class="rd ${ok?'ok':'no'}"></div><span style="color:#e8f4fd;font-weight:600">${q.d}</span><span style="color:var(--text-dim)"> · ${q.gu}${skip?' (건너뜀)':''}</span>`;
  l.insertBefore(e,l.firstChild);
  while(l.children.length>25)l.removeChild(l.lastChild);
}
</script>
